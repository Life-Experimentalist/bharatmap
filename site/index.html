<script>
  // Resolve the theme before first paint so a dark choice does not flash light.
  // Kumo reads data-mode="dark" on <html>; the saved choice (light, dark or system) is kept under bharatmap-theme.
  // While the page is dark it adds a darkreader-lock meta, so the Dark Reader extension leaves the page's own dark theme alone.
  (function () {
    var dark = false, d = document.documentElement;
    try {
      var t = localStorage.getItem("bharatmap-theme");
      dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
    } catch (e) {}
    if (!dark) return;
    d.setAttribute("data-mode", "dark");
    d.style.colorScheme = "dark";
    var m = document.createElement("meta");
    m.name = "darkreader-lock";
    document.head.appendChild(m);
    var tc = document.querySelector('meta[name="theme-color"]');
    if (tc) tc.setAttribute("content", "#000000");
  })();
</script>
