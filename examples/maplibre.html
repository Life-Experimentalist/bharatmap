<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bharatmap, MapLibre example</title>
<link rel="stylesheet" href="../node_modules/maplibre-gl/dist/maplibre-gl.css">
<style>
  html, body, #map { margin: 0; height: 100%; }
  #bar { position: absolute; z-index: 2; top: 8px; left: 8px; background: #fff; padding: 6px 8px; font: 13px sans-serif; border-radius: 4px; }
</style>
</head>
<body>
<div id="bar">
  <select id="theme"><option value="positron">Light</option><option value="dark-matter">Dark</option></select>
  <select id="view">
    <option value="78,22,3">India</option>
    <option value="77,34,2.2">Ladakh, world zoom</option>
    <option value="94,28.3,6">Arunachal Pradesh</option>
    <option value="78.4,32.4,10">Spiti junction</option>
    <option value="91.6,27.8,11">Bhutan junction</option>
  </select>
  <label><input id="fix" type="checkbox" checked> fixed</label>
</div>
<div id="map"></div>
<script src="../node_modules/maplibre-gl/dist/maplibre-gl.js"></script>
<script src="../dist/bharatmap.iife.js"></script>
<script>
  BharatMap.install(maplibregl);
  const map = new maplibregl.Map({ container: "map", style: { version: 8, sources: {}, layers: [] }, center: [78, 22], zoom: 3 });
  const url = (t) => `https://basemaps.cartocdn.com/gl/${t}-gl-style/style.json`;
  async function load() {
    const theme = document.getElementById("theme").value;
    map.setStyle(document.getElementById("fix").checked ? await BharatMap.fixStyle(url(theme)) : url(theme));
  }
  document.getElementById("theme").onchange = document.getElementById("fix").onchange = load;
  document.getElementById("view").onchange = (e) => { const [x, y, z] = e.target.value.split(",").map(Number); map.jumpTo({ center: [x, y], zoom: z }); };
  load();
</script>
</body>
</html>
